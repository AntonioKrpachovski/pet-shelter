name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shelter-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shelter-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shelter-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shelter-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-deployment:
    name: Verify Live Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Check backend health
        run: |
          echo "Checking backend health..."
          STATUS=$(curl -s https://shelter-backend-qr3y.onrender.com/actuator/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          echo "Backend status: $STATUS"
          if [ "$STATUS" != "UP" ]; then
            echo "Backend is not healthy!"
            exit 1
          fi
          echo "Backend is healthy!"

      - name: Check animals endpoint
        run: |
          echo "Checking animals API..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://shelter-backend-qr3y.onrender.com/api/animals)
          echo "HTTP response code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Animals endpoint returned $HTTP_CODE!"
            exit 1
          fi
          echo "Animals endpoint is working!"

      - name: Check frontend
        run: |
          echo "Checking frontend..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://shelter-frontend-latest.onrender.com)
          echo "HTTP response code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Frontend returned $HTTP_CODE!"
            exit 1
          fi
          echo "Frontend is working!"
