services:

  mongodb:
    image: mongo:7.0
    container_name: shelter-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: shelter
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - shelter-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: shelter-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017/shelter
      MONGO_DB: shelter
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shelter-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: shelter-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shelter-net

networks:
  shelter-net:
    driver: bridge

volumes:
  mongo-data:
