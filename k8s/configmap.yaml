apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: shelter
data:
  MONGO_URI: "mongodb://mongodb-0.mongodb-service:27017,mongodb-1.mongodb-service:27017,mongodb-2.mongodb-service:27017/shelter?replicaSet=rs0"
  MONGO_DB: "shelter"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: shelter
data:
  MONGO_INITDB_DATABASE: "shelter"
