services:
  # MongoDB service
  - type: private
    name: shelter-mongodb
    runtime: image
    image:
      url: mongo:7.0
    envVars:
      - key: MONGO_INITDB_DATABASE
        value: shelter
    disk:
      name: mongo-data
      mountPath: /data/db
      sizeGB: 10

  # Backend service
  - type: web
    name: shelter-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: MONGO_URI
        value: mongodb://shelter-mongodb:27017/shelter
      - key: MONGO_DB
        value: shelter
    healthCheckPath: /actuator/health

  # Frontend service
  - type: web
    name: shelter-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_URL
        fromService:
          name: shelter-backend
          type: web
          property: host